title: Sandeep Singh
tagline: Finance, money & research
description: >-
  Plain-language writing on personal finance, banking, markets and
  investing, plus research notes and free PDFs by Sandeep Singh, PhD
  scholar in banking and financial markets at IIT (ISM) Dhanbad.

author:
  name: Sandeep Singh
  role: PhD Scholar, Banking & Financial Markets, IIT (ISM) Dhanbad
  department: Department of Management Studies
  institution: IIT (ISM) Dhanbad
  address: Dhanbad, Jharkhand 826004

# Your web address. Replace YOUR-GITHUB-USERNAME with your GitHub username.
url: "https://singhsandeepfinance-ui.github.io"
# Leave baseurl empty if your repository is named YOUR-GITHUB-USERNAME.github.io
# If your repository has another name (e.g. "finance-site"), use: baseurl: "/finance-site"
baseurl: ""

# Contact links. Fill in the ones you want to show; leave "" to hide a link.
contact:
  email: "singhsandeep.finance@gmail.com"
  linkedin: "https://www.linkedin.com/in/sandeepsingh-finance"
  orcid: "https://orcid.org/0009-0005-6386-3342"
  ssrn: "https://ssrn.com/author=7371044"
  researchgate: "https://www.researchgate.net/profile/Sandeep-Singh-200"
  google_scholar: ""   # full link to your Google Scholar profile, when you have one

# ─────────────────────────────────────────────────────────────
#  Technical settings — you normally never need to change these.
# ─────────────────────────────────────────────────────────────
lang: en-IN
timezone: Asia/Kolkata
permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - HOW-TO-POST.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - .vscode/
