{% if site.author.photo and site.author.photo != "" %}
<img class="avatar avatar-{{ include.size | default: 'large' }}" src="{{ site.author.photo | relative_url }}" alt="{{ site.author.name }}" width="240" height="240">
{% else %}
<span class="avatar avatar-{{ include.size | default: 'large' }} avatar-initials" aria-hidden="true"><b>SS</b></span>
{% endif %}
